#
# BinktermPHP docker-compose.yml
#
# Production-ready Docker Compose configuration for BinktermPHP
#
# Usage:
#   1. Copy .env.example to .env (it must exist before the first `up`) and
#      configure BinktermPHP itself -- this is the exact same file bare-metal
#      installs use (SITE_URL, credentials, feature flags, etc.). It's
#      bind-mounted live into the app container, so editing it and running
#      `docker-compose restart binkterm` is enough to pick up a change --
#      no rebuild or recreate needed.
#   2. Copy docker-compose.override.yml.example to docker-compose.override.yml
#      for Docker-only settings: optional daemons, published host ports,
#      scheduled-job timing. See that file for the full list. Changes here
#      DO need `docker-compose up -d` (recreate), since they're baked into
#      the container's environment at creation time.
#   3. First run: RUN_SETUP=true docker-compose up -d
#   4. Subsequent runs: docker-compose up -d
#
# .env and docker-compose.override.yml are deliberately separate: .env is
# BinktermPHP application configuration and nothing else, so it never shares
# variable names with anything Docker-specific. See docs/DOCKER.md.
#
services:
  postgres:
    image: postgres:15-alpine
    container_name: binkterm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-binkterm}
      POSTGRES_USER: ${DB_USER:-binkterm}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - binkterm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-binkterm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  binkterm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binkterm-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Docker-computed: a bare-metal .env normally points at DB_HOST=localhost,
      # but inside Compose the database is the separate "postgres" service.
      DB_HOST: postgres
      DB_PORT: 5432

      # Optional daemons (all off by default). Override in
      # docker-compose.override.yml, not here and not in .env --
      # see docs/DOCKER.md#included-services.
      ENABLE_GEMINI: "false"
      ENABLE_SSH: "false"
      ENABLE_FTP: "false"
      ENABLE_MRC: "false"
      ENABLE_AI_BOT: "false"
      ENABLE_MATTERBRIDGE: "false"
      ENABLE_MCP_SERVER: "false"
      ENABLE_NNTP: "false"

      # Scheduled maintenance jobs (all on by default, run via cron).
      # Override in docker-compose.override.yml.
      ENABLE_RSS_POSTER: "true"
      RSS_POSTER_SCHEDULE: "0 * * * *"
      ENABLE_ECHOMAIL_ROBOTS: "true"
      ECHOMAIL_ROBOTS_SCHEDULE: "*/5 * * * *"
      ENABLE_LOGROTATE: "true"
      LOGROTATE_SCHEDULE: "0 0 * * 0"
      LOGROTATE_KEEP: "52"

      # Setup flag -- set inline for the first run only:
      #   RUN_SETUP=true docker-compose up -d
      RUN_SETUP: ${RUN_SETUP:-false}

    ports:
      - "80:80"
      - "2323:2323"
      - "24554:24554"
      - "6001:6001"
      - "6010:6010"
      # Optional daemon ports are not published by default -- enabling a
      # daemon above also needs its port added via
      # docker-compose.override.yml. See docker-compose.override.yml.example.
    volumes:
      # BinktermPHP's own application config, bind-mounted live so entrypoint.sh
      # picks up edits on every container start -- `docker-compose restart
      # binkterm` is enough, no recreate needed. Must exist before first `up`
      # or Docker will create an empty directory at this path instead.
      - ./.env:/var/www/html/.env.source:ro

      # Persistent data volumes
      - binkterm_data:/var/www/html/data
      - binkterm_config:/var/www/html/config

      # Optional: Mount door games from host (uncomment to use)
      # - ./scripts/dosbox-bridge/dos/doors:/var/www/html/scripts/dosbox-bridge/dos/doors:ro

      # Optional: Mount development files for live editing (development only)
      # - ./public_html:/var/www/html/public_html
      # - ./templates:/var/www/html/templates
      # - ./src:/var/www/html/src

    networks:
      - binkterm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  binkterm_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  binkterm_data:
    driver: local
  binkterm_config:
    driver: local
