; The php:8.2-apache base image ships with no php.ini (see php-error-logging.ini
; for details), so upload_max_filesize and post_max_size fall back to PHP's
; compiled-in defaults (2M / 8M), which are too small for file area uploads
; and door/attachment transfers. Raise them to a reasonable ceiling; post_max_size
; is kept larger than upload_max_filesize to leave room for form fields alongside
; the uploaded file, matching the guidance in FAQ.md.
upload_max_filesize = 128M
post_max_size = 136M
