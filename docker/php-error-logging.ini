; The php:8.2-apache base image ships with no php.ini at all (only the
; docker-php-ext-*.ini fragments that enable extensions), so PHP runs on its
; compiled-in defaults: log_errors is Off and there is no error_log target.
; Fatal/parse errors never reach a log file - display_errors On means they
; only show up inline in the HTTP response body, which for JSON/AJAX
; endpoints is invisible (the frontend just sees a failed JSON parse and
; falls back to a generic error message).
;
; Route PHP-engine errors to a real log file instead, and turn off inline
; display so they don't leak into HTTP responses.
display_errors = Off
log_errors = On
error_log = /var/www/html/data/logs/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED
