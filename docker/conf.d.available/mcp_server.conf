[program:mcp_server]
command=node /var/www/html/mcp-server/server.js
autostart=true
autorestart=true
stdout_logfile=/var/www/html/data/logs/mcp_server.log
stdout_logfile_maxbytes=10485760
stderr_logfile=/var/www/html/data/logs/mcp_server_error.log
stderr_logfile_maxbytes=10485760
user=binkterm
directory=/var/www/html/mcp-server
