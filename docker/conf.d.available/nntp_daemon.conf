[program:nntp_daemon]
; Binds high ports inside the container (the binkterm user cannot bind 119/563).
; docker-compose publishes host 119 -> 8119 and host 563 -> 8563.
command=php /var/www/html/scripts/nntp_server.php --host=0.0.0.0 --port=8119 --tls-port=8563
autostart=true
autorestart=true
stdout_logfile=/var/www/html/data/logs/nntp_daemon.log
stdout_logfile_maxbytes=10485760
stderr_logfile=/var/www/html/data/logs/nntp_daemon_error.log
stderr_logfile_maxbytes=10485760
user=binkterm
directory=/var/www/html
