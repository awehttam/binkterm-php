[program:nntp_daemon]
command=php /var/www/html/scripts/nntp_server.php --host=0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/var/www/html/data/logs/nntp_daemon.log
stdout_logfile_maxbytes=10485760
stderr_logfile=/var/www/html/data/logs/nntp_daemon_error.log
stderr_logfile_maxbytes=10485760
user=binkterm
directory=/var/www/html
