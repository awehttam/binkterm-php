[program:ssh_daemon]
command=php /var/www/html/ssh/ssh_daemon.php --host=0.0.0.0 --api-base=http://localhost
autostart=true
autorestart=true
stdout_logfile=/var/www/html/data/logs/ssh_daemon.log
stdout_logfile_maxbytes=10485760
stderr_logfile=/var/www/html/data/logs/ssh_daemon_error.log
stderr_logfile_maxbytes=10485760
user=binkterm
directory=/var/www/html
